<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopUA - Кошик</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="logo" href="index.html">ShopUA</a>
            <nav>
                <a class="nav-btn" href="index.html">Головна</a>
                <a class="nav-btn" href="catalog.html">Каталог</a>
                <a class="nav-btn" href="about.html">Про нас</a>
                <a class="cart-btn active" href="cart.html">
                    Кошик <span class="cart-count" id="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div class="section" style="max-width: 800px;">
            <div class="section-title">Кошик</div>
            <div id="cart-content"></div>
        </div>
    </main>

    <footer>ShopUA - Супер пупер!</footer>

    <div class="toast" id="toast"></div>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/utils.js"></script>
    <script>
        function renderCart() {
            let container = document.getElementById("cart-content");
            container.innerHTML = "";

            let cart = loadCart();

            if (cart.length === 0){
                container.innerHTML = 
                '<div class"cart-empty">'+
                    '<div class="empty-icon">🛒<div>'+
                        '<p>Кошик порожній</p>'
            }
        }
    </script>
</body>
</html>
